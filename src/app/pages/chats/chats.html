<div class="chat-layout">
  <aside class="chat-sidebar" [class.chat-sidebar--hidden-mobile]="isChatOpen">
    <header class="chat-sidebar__header">
      <h1>Chats</h1>
      <a routerLink="/nuevo">Nuevo</a>
    </header>

    <div class="chat-search">
      <input type="text" placeholder="Buscar chat..." [formControl]="searchControl" />
    </div>

    <div class="chat-sidebar__list">
      <app-chat-list [chats]="filteredChats" />
    </div>
  </aside>

  <main class="chat-window" [class.chat-window--mobile]="isChatOpen">
    <app-chat-window [chat]="selectedChat" />
  </main>
</div>
