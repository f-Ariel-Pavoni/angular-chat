@if (chat) {
  <header class="chat-window__header">
    <button
      type="button"
      class="chat-window__back"
      (click)="goBack()"
      aria-label="Volver a los chats"
    >
      <lucide-icon [img]="ArrowLeft" />
    </button>
    <h2>{{ chat.name }}</h2>

    <button type="button" class="chat-window__delete" (click)="openConfirmModal()">
      <lucide-icon [img]="Trash2" />
    </button>
  </header>

  <div class="chat-window__messages" #messagesContainer>
    @for (message of chat.messages; track message.id) {
      <p
        class="message"
        [class.message--user]="message.author === 'user'"
        [class.message--app]="message.author === 'app'"
      >
        {{ message.content }}
      </p>
    }
  </div>

  <div class="chat-window__form">
    <input
      type="text"
      placeholder="Escribí un mensaje..."
      [formControl]="messageControl"
      (keydown.enter)="onSubmit(); $event.preventDefault()"
    />

    <button type="button" (click)="onSubmit()">Enviar</button>
  </div>

  @if (showConfirmModal) {
    <app-confirm-modal
      message="¿Querés borrar todos los mensajes de este chat?"
      (confirmed)="clearMessages()"
      (cancelled)="cancelClearMessages()"
    />
  }
} @else {
  <div class="chat-window__empty">
    <p>Seleccioná un chat para comenzar.</p>
  </div>
}
